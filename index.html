<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseSelect Product App</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-view="mobile">
  <div class="preview-toolbar" aria-label="Preview mode">
    <strong>MuseSelect Demo</strong>
    <div class="view-switch" role="group" aria-label="Choose preview device">
      <button class="view-btn" type="button" data-view-target="web">Web</button>
      <button class="view-btn is-active" type="button" data-view-target="mobile">Mobile</button>
    </div>
  </div>

  <main class="app-shell">
    <section id="app" class="app-view" aria-live="polite"></section>

    <nav class="tabbar" aria-label="Primary navigation">
      <button type="button" data-route="#/select" data-tab="select">
        <span>Select</span>
      </button>
      <button type="button" data-disabled-tab="museland" data-tab="museland">
        <span>Museland</span>
      </button>
      <button class="global-create-trigger" type="button" data-global-create-toggle data-tab="create" aria-expanded="false">
        <span>+Create</span>
      </button>
      <button type="button" data-route="#/discover" data-tab="discover">
        <span>Discover</span>
      </button>
      <button type="button" data-route="#/mine" data-tab="mine">
        <span>Mine</span>
      </button>
    </nav>

    <div class="global-create-menu" data-global-create-menu hidden>
      <button class="global-create-backdrop" type="button" aria-label="Close create menu" data-close-global-create></button>
      <section class="global-create-panel" aria-label="Create menu">
        <div class="global-create-hint">
          <strong>Make Content For Me</strong>
        </div>
        <button type="button" data-global-create-action="Shoppable Video">
          <em>Recommended</em>
          <strong>Make Shoppable Video For Me</strong>
          <small>TK · IG REELS · YOUTUBE SHOTS</small>
          <span>No sample waiting. Muse creates a short selling video for you.</span>
          <b>Start Now</b>
        </button>
        <button type="button" data-global-create-action="Tryon Post">
          <strong>Make Image Post For Me</strong>
          <small>IG STORY · IG POST · PINTEREST · TK</small>
          <span>Create image-ready content for social promotion.</span>
          <b>Start Now</b>
        </button>
      </section>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
